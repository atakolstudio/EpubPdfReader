name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        id: build_debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_debug.log
        continue-on-error: true

      - name: Build unsigned release APK
        id: build_release
        if: steps.build_debug.outcome == 'success'
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build_release.log
        continue-on-error: true

      - name: Report failure log as GitHub issue
        if: steps.build_debug.outcome == 'failure' || steps.build_release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat build_debug.log build_release.log 2>/dev/null | tail -c 55000 > tail.log
          gh issue create \
            --title "Build hatasi: ${GITHUB_SHA::7}" \
            --body-file tail.log

      - name: Fail job if build failed
        if: steps.build_debug.outcome == 'failure' || steps.build_release.outcome == 'failure'
        run: exit 1

      - name: List build outputs (diagnostic)
        if: always()
        run: |
          echo "--- find app/build/outputs ---"
          find app/build/outputs -type f 2>&1 || true
          echo "--- ls apk/debug ---"
          ls -la app/build/outputs/apk/debug/ 2>&1 || true
          echo "--- ls apk/release ---"
          ls -la app/build/outputs/apk/release/ 2>&1 || true

      - name: Report diagnostic as GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "build_debug outcome: ${{ steps.build_debug.outcome }}"
            echo "build_release outcome: ${{ steps.build_release.outcome }}"
            echo "--- find app/build/outputs ---"
            find app/build/outputs -type f 2>&1 || true
            echo "--- ls apk/debug ---"
            ls -la app/build/outputs/apk/debug/ 2>&1 || true
            echo "--- ls apk/release ---"
            ls -la app/build/outputs/apk/release/ 2>&1 || true
          } > diag.log
          gh issue create \
            --title "CI teshis: ${GITHUB_SHA::7}" \
            --body-file diag.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
